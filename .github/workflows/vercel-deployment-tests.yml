name: Test Vercel deployment control

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/vercel-*.yml'
      - 'web/vercel.json'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**'
      - '.github/workflows/vercel-*.yml'
      - 'web/vercel.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: node --test .github/scripts/vercel-deploy.test.mjs
