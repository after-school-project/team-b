name: Request Vercel production deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 同じ公開版でも再ビルドを要求する（実行中の同一SHAは再利用）
        type: boolean
        default: false

permissions:
  contents: read

# Actionsの要求処理を直列化する。実行中のVercelビルドはスクリプト側で扱う。
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'after-school-project/team-b' && github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Decide and request remote build
        run: node .github/scripts/vercel-deploy.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
