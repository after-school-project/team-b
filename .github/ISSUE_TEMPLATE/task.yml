name: 開発タスク
description: 機能実装・文書修正・保守作業の目的と完成条件を整理します。
body:
  - type: markdown
    attributes:
      value: |
        タイトルは接頭辞を付けず、実現・修正することを簡潔に記載してください。
        書き方はリポジトリの `docs/development/issue-guide.md`、共通ルールは `CONTRIBUTING.md` を参照してください。
        小さな文書修正や保守作業では、任意項目は省略できます。機密情報は記載しないでください。
  - type: textarea
    id: purpose
    attributes:
      label: 目的
      description: 誰が何をできるようにするか、または何を改善するかを記載します。
      placeholder: 学校発行アカウントで、利用者がログインできるようにする。
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 実装・変更すること
      description: このIssueで行う作業をチェックリストで記載します。
      placeholder: |
        - [ ] ログイン画面を作成する
        - [ ] ログイン処理を実装する
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 対象範囲
      description: 機能や仕様の変更では選択してください。小さな文書修正・保守作業では省略できます。
      options:
        - PoC
        - MVP
        - 共通
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: 対象外
      description: 今回対応しない機能や作業を記載します。対象範囲を記載する場合、なければ「なし」と記載します。
      placeholder: パスワード再発行は別Issueで対応する。
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 関連する要件・設計
      description: 関係する項目だけ記載します。PoCとMVPで仕様が異なる場合は、適用する決定と参照先を明記してください。
      placeholder: |
        - 要件ID：
        - 決定ID：
        - 画面ID：
        - API ID：
        - 関連テーブル：
        - 参照資料：[資料名](URL)「節名」
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 受入条件
      description: 前提・操作・期待結果が分かる完成条件を記載します。該当する正常系・異常系・権限や状態の制限を含めてください。
      placeholder: |
        - [ ] AC-01：有効な学校発行アカウントでログインすると、ホーム画面へ移動する。
        - [ ] AC-02：誤ったパスワードではログインできず、エラーを表示する。
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: 確認方法
      description: 各受入条件に対応する前提・操作・期待結果、または既存のテストや確認手順への参照を記載します。実際の確認結果はPRへ記載します。
      placeholder: |
        - AC-01：有効なテストアカウントでログインし、ホーム画面へ移動することを確認する。
        - AC-02：未ログインの状態で誤ったパスワードを入力し、エラー表示と保護された画面を利用できないことを確認する。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依存関係・確認事項
      description: 関係する項目だけ記載します。先行・関連Issueは番号かURLを添え、未決事項が着手や完成の判断に影響するかを明記してください。
      placeholder: |
        - 先行Issue：#123 DB接続の整備（認証情報を取得するため）
        - 関連Issue：#124 ログアウト機能
        - 確認事項：ログイン失敗時の表示文言
        - 未決事項による影響：処理の実装には着手できるが、文言の決定が画面の受入確認に必要。
    validations:
      required: false
